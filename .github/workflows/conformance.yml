name: conformance

on:
    push:
    workflow_dispatch:
    schedule:
        - cron: '0 6 * * 1'

permissions:
    contents: read

jobs:
    python:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Checkout the wallet branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: nicky2pc/canton-tx-hashing
                  ref: feat/core-tx-hashing
                  ssh-key: ${{ secrets.WALLET_DEPLOY_KEY }}
                  path: wallet
                  sparse-checkout: core/tx-hashing/vectors
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.13'

            - name: Install protobuf and grpcio-tools
              run: |
                  python -m pip install --only-binary :all: --require-hashes -r python/requirements.txt

            - name: Fetch the Python example
              run: ./python/fetch_reference.sh

            - name: Hash the vectors with the Python example
              run: python -I python/check_vectors.py wallet/core/tx-hashing/vectors

            - name: Hash the Canton 3.6.4 capture with the Python example
              run: python -I python/check_vectors.py captures/canton-3.6.4-pv36

    visualizer:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Checkout the wallet branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: nicky2pc/canton-tx-hashing
                  ref: feat/core-tx-hashing
                  ssh-key: ${{ secrets.WALLET_DEPLOY_KEY }}
                  path: wallet
                  sparse-checkout: core/tx-hashing/vectors
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: wallet/.nvmrc
                  package-manager-cache: false

            - name: Install core-tx-visualizer 1.9.1
              working-directory: ts
              run: npm ci

            - name: Hash the V2 vectors with core-tx-visualizer 1.9.1
              working-directory: ts
              run: node check-visualizer.ts ../wallet/core/tx-hashing/vectors

            - name: Hash the V2 vectors of the Canton 3.6.4 capture with core-tx-visualizer 1.9.1
              working-directory: ts
              run: node check-visualizer.ts ../captures/canton-3.6.4-pv36

    mutation:
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            # The generator finds the wallet at ../wallet, so this job checks out both side by side.
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: conformance
                  persist-credentials: false

            - name: Checkout the wallet branch
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: nicky2pc/canton-tx-hashing
                  ref: feat/core-tx-hashing
                  ssh-key: ${{ secrets.WALLET_DEPLOY_KEY }}
                  path: wallet
                  sparse-checkout: |
                      core/ledger-proto
                      core/tx-hashing
                  persist-credentials: false

            - name: Set up pnpm and Node.js
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  working-directory: wallet
                  node-version-file: .nvmrc
                  install: false

            - name: Install the wallet's tsx and the dependencies of core-ledger-proto
              working-directory: wallet
              run: pnpm install --frozen-lockfile --ignore-scripts --filter wallet-kernel --filter @canton-network/core-ledger-proto

            - name: Make the mutation and reject vectors again
              working-directory: conformance/generator
              run: ../../wallet/node_modules/.bin/tsx mutate-vectors.ts

            - name: Fail if a vector changed
              run: |
                  changed=$(git -C wallet status --porcelain core/tx-hashing/vectors)
                  if [ -n "$changed" ]; then
                      echo "$changed"
                      exit 1
                  fi
